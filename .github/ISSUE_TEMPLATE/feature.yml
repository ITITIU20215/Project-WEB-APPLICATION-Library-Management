name: Feature
description: A piece of feature work (one user story or a small slice of one).
labels: [feature]
body:
  - type: input
    id: feature-id
    attributes:
      label: Feature ID
      description: The feature this work belongs to.
      placeholder: e.g. F06
    validations:
      required: true
  - type: textarea
    id: user-story
    attributes:
      label: User story
      placeholder: As a <role>, I want <goal>, so that <benefit>.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      placeholder: |
        Given ...
        When ...
        Then ...
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: API endpoints, screens, DB changes, open questions.
