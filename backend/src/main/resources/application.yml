spring:
  application:
    name: library-backend
  # Reads the root .env (KEY=value) when running from the backend folder.
  config:
    import: optional:file:../.env[.properties]
  profiles:
    default: dev
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:${MYSQL_HOST_PORT:3307}/library_db}
    username: ${DB_USERNAME:library}
    password: ${DB_PASSWORD:library}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

app:
  cors:
    allowed-origins:
      - http://localhost:5173
